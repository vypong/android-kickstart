name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast, no Android toolchain required: version logic, template rendering, and the
  # config audit. Runs on all three platforms because path handling, line endings and
  # process spawning are exactly where a generator breaks across machines.
  unit:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unit tests and config audit
        run: npm test

      - name: Detection does not crash on this platform
        run: node bin/kickstart.mjs --list-studios

      - name: Resolve versions and render a catalog
        run: node bin/kickstart.mjs --dry-run --yes --name=CI --package=com.ci.app

      - name: Generate every option combination (no build)
        shell: bash
        run: |
          set -e
          for di in hilt koin none; do
            for db in room sqldelight none; do
              node bin/kickstart.mjs --yes --offline --force \
                --name=CI --package=com.ci.app \
                --di=$di --db=$db --network=ktor --prefs=datastore --image=coil \
                --out="$RUNNER_TEMP/gen-$di-$db"
            done
          done

  # The claim this project makes is that the resolved versions actually compile together.
  # This is the job that proves it, on a machine that is not the author's.
  build:
    name: Real Gradle build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3

      - name: Generate and build the default stack
        run: |
          node bin/kickstart.mjs --yes --build --force \
            --name=CIApp --package=com.ci.app \
            --di=hilt --network=retrofit --db=room --prefs=datastore --image=coil \
            --out="$RUNNER_TEMP/CIApp"

      - name: Upload the build report if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: ${{ runner.temp }}/CIApp/app/build/reports
          if-no-files-found: ignore
