<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>android-kickstart</title>
<link rel="icon" type="image/svg+xml" href="/logos/appmark.svg">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  /* Design tokens. Light is the default; [data-theme="dark"] on <html> swaps them. */
  :root {
    --primary: #0b57d0;
    --primary-hover: #0842a0;
    --primary-press: #062e6f;
    --on-primary: #ffffff;
    --primary-container: #d3e3fd;
    --on-primary-container: #041e49;
    --primary-surface: #f7faff;

    --on-surface: #1f1f1f;
    --on-surface-variant: #5f6368;
    --on-surface-muted: #80868b;
    --on-surface-faint: #a3a7ab;

    --surface: #ffffff;
    --surface-low: #f8f9fa;
    --surface-container: #f1f3f4;

    --outline: #c4c7ca;
    --outline-variant: #d8dbdf;
    --divider: #e3e6ea;

    --success: #0d652d;
    --success-container: #e6f4ea;
    --error: #d93025;
    --warn: #8c5900;
    --warn-container: #fef7e0;

    --state-hover: .08;
    --sans: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'Roboto Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
    --shadow-drawer: 0 -8px 24px rgba(31,31,31,.10);
    --shadow-pop: 0 4px 8px 3px rgba(31,31,31,.15), 0 1px 3px rgba(31,31,31,.30);
  }
  html[data-theme="dark"] {
    --primary: #a8c7fa;
    --primary-hover: #c2d7fb;
    --primary-press: #d3e3fd;
    --on-primary: #062e6f;
    --primary-container: #0842a0;
    --on-primary-container: #d3e3fd;
    --primary-surface: #17233a;

    --on-surface: #e3e3e3;
    --on-surface-variant: #9aa0a6;
    --on-surface-muted: #80868b;
    --on-surface-faint: #6f7479;

    --surface: #131417;
    --surface-low: #1b1c1f;
    --surface-container: #22242a;

    --outline: #5f6368;
    --outline-variant: #3c4043;
    --divider: #303338;

    --success: #6dd58c;
    --success-container: #0f2818;
    --error: #f2b8b5;
    --warn: #ffd98a;
    --warn-container: #2a2110;
    --shadow-drawer: 0 -8px 24px rgba(0,0,0,.5);
    --shadow-pop: 0 4px 8px 3px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--surface); color: var(--on-surface);
    font: 400 13px/18px var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--primary-container); color: var(--on-primary-container); }

  .shell { display: flex; flex-direction: column; height: 100vh; }

  /* ---------------- header ---------------- */
  .hdr {
    flex: none; display: flex; align-items: center; gap: 16px;
    height: 56px; padding: 0 32px; border-bottom: 1px solid var(--divider);
  }
  .hdr img.mark { width: 24px; height: 24px; }
  .wordmark { font: 500 16px/20px var(--sans); letter-spacing: .1px; color: var(--on-surface); }
  .hdr .spacer { flex: 1; }

  .env-pill {
    display: inline-flex; align-items: center; gap: 8px;
    height: 30px; padding: 0 12px; border-radius: 999px;
    border: 1px solid var(--outline-variant); background: transparent;
    font: 400 13px/16px var(--sans); color: var(--on-surface-variant);
    cursor: default; max-width: 420px;
  }
  .env-pill.actionable { cursor: pointer; }
  .env-pill .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--success); flex: none; }
  .env-pill.bad .dot { background: var(--error); }
  .env-pill.bad { color: var(--error); border-color: color-mix(in srgb, var(--error) 45%, transparent); }

  .theme-toggle {
    display: inline-flex; height: 30px; border: 1px solid var(--divider);
    border-radius: 999px; overflow: hidden;
  }
  .theme-toggle button {
    border: none; background: transparent; cursor: pointer;
    padding: 0 12px; font: 500 12px/16px var(--sans); color: var(--on-surface-variant);
  }
  .theme-toggle button[aria-pressed="true"] {
    background: var(--primary-container); color: var(--on-primary-container);
  }

  /* ---------------- scroll region ---------------- */
  .scroll { flex: 1; min-height: 0; overflow: auto; padding: 28px 32px 0; }

  .title-row { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 14px; }
  .title-row h1 { margin: 0; font: 400 26px/32px var(--sans); color: var(--on-surface); }
  .title-row .note { font: 400 13px/20px var(--sans); color: var(--on-surface-muted); padding-bottom: 3px; }

  /* ---------------- presets ---------------- */
  .presets { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; margin-bottom: 28px; }
  .preset {
    text-align: left; border-radius: 14px; padding: 16px 18px;
    border: 1px solid var(--outline-variant); background: var(--surface);
    cursor: pointer; font: inherit; color: inherit;
  }
  .preset:hover { border-color: var(--outline); }
  .preset[aria-pressed="true"] {
    border: 2px solid var(--primary); background: var(--primary-surface); padding: 15px 17px;
  }
  .preset-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .preset-title { font: 500 15px/20px var(--sans); }
  .preset[aria-pressed="true"] .preset-title { color: var(--on-primary-container); }
  html[data-theme="dark"] .preset[aria-pressed="true"] .preset-title { color: var(--on-surface); }
  .badge-selected {
    display: inline-flex; align-items: center; height: 20px; padding: 0 8px;
    border-radius: 5px; background: var(--primary); color: var(--on-primary);
    font: 500 11px/16px var(--sans);
  }
  .preset .tick { margin-left: auto; color: var(--primary); display: none; }
  .preset[aria-pressed="true"] .tick { display: block; }
  .preset .tick svg { width: 18px; height: 18px; display: block; }
  .preset p { margin: 0 0 14px; font: 400 13px/18px var(--sans); color: var(--on-surface-variant); text-wrap: pretty; }
  .preset .logos { display: flex; gap: 10px; }
  .preset .logos img { width: 20px; height: 20px; object-fit: contain; }
  .preset .modified { font: 400 12px/16px var(--sans); color: var(--on-surface-muted); }

  /* ---------------- section rules ---------------- */
  .rule { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .rule .label {
    font: 500 11px/16px var(--sans); letter-spacing: .1em;
    text-transform: uppercase; color: var(--on-surface-muted);
  }
  .rule .sub { font: 400 12px/16px var(--sans); color: var(--on-surface-faint); }
  .rule .line { flex: 1; height: 1px; background: var(--divider); }
  .rule .link {
    font: 500 12px/16px var(--sans); color: var(--primary);
    background: none; border: none; cursor: pointer; padding: 0;
  }
  .rule .link:hover { text-decoration: underline; }

  /* ---------------- project fields ---------------- */
  .fields { display: grid; grid-template-columns: 260px 300px minmax(0,1fr); gap: 20px; margin-bottom: 28px; }
  .field label {
    display: block; margin-bottom: 6px;
    font: 500 12px/16px var(--sans); letter-spacing: .3px; color: var(--on-surface-variant);
  }
  .field input {
    width: 100%; height: 44px; padding: 0 14px;
    font: 400 15px/20px var(--sans); color: var(--on-surface);
    background: var(--surface); border: 1px solid var(--outline); border-radius: 10px;
  }
  .field input.mono { font: 400 14px/20px var(--mono); }
  input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible {
    outline: none; border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary);
  }
  .dest {
    display: flex; align-items: center; height: 44px; overflow: hidden;
    border: 1px solid var(--outline); border-radius: 10px; background: var(--surface);
  }
  .dest .path {
    flex: 1; min-width: 0; padding: 0 14px; font: 400 14px/20px var(--mono);
    color: var(--on-surface); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .dest .sep { width: 1px; height: 100%; background: var(--divider); }
  .dest .browse {
    display: inline-flex; align-items: center; gap: 8px; padding: 0 16px; height: 100%;
    font: 500 13px/16px var(--sans); color: var(--primary);
    background: none; border: none; cursor: pointer;
  }
  .dest .browse svg { width: 16px; height: 16px; }

  /* ---------------- stack: segmented controls ---------------- */
  .stack { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 20px 28px; }
  .seg-row { display: flex; align-items: center; gap: 14px; position: relative; }
  .seg-row > .row-label { width: 96px; flex: none; font: 400 12px/16px var(--sans); color: var(--on-surface-variant); }
  .seg {
    display: inline-flex; border: 1px solid var(--outline-variant);
    border-radius: 9px; overflow: hidden; background: var(--surface);
  }
  .seg button {
    position: relative; display: inline-flex; align-items: center; gap: 7px;
    height: 34px; padding: 0 12px; border: none; background: transparent; cursor: pointer;
    font: 500 12px/16px var(--sans); color: var(--on-surface-variant); white-space: nowrap;
  }
  .seg button.plain { color: var(--on-surface-muted); }
  .seg button::before {
    content: ''; position: absolute; inset: 0; background: currentColor;
    opacity: 0; transition: opacity .15s; pointer-events: none;
  }
  .seg button:hover:not([aria-pressed="true"])::before { opacity: var(--state-hover); }
  .seg button[aria-pressed="true"] { background: var(--primary-container); color: var(--on-primary-container); }
  .seg button img { width: 15px; height: 15px; object-fit: contain; }
  .seg .divider { width: 1px; background: var(--outline-variant); flex: none; }

  /* ---------------- popover ---------------- */
  .pop {
    position: absolute; z-index: 60; left: 0; bottom: calc(100% + 8px); width: 340px;
    padding: 16px; border-radius: 12px; background: var(--surface);
    border: 1px solid var(--divider); box-shadow: var(--shadow-pop);
    opacity: 0; visibility: hidden; transform: translateY(4px);
    transition: opacity .14s, transform .14s, visibility .14s; text-align: left;
  }
  .seg-row:hover .pop, .seg-row:focus-within .pop { opacity: 1; visibility: visible; transform: none; }
  .stack > .seg-row:nth-child(3n) .pop { left: auto; right: 0; }
  @media (prefers-reduced-motion: reduce) { .pop { transition: none; } }
  .pop-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .pop-head img { width: 22px; height: 22px; object-fit: contain; }
  .pop-title { font: 500 14px/18px var(--sans); }
  .pop-vendor { font: 400 11px/16px var(--mono); color: var(--on-surface-muted); }
  .pop p { margin: 0 0 8px; font: 400 13px/18px var(--sans); color: var(--on-surface-variant); }
  .pop p.lead { color: var(--on-surface); }
  .pop .links { display: flex; gap: 8px; margin-top: 10px; }
  .pop .links a {
    display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px;
    border: 1px solid var(--divider); border-radius: 8px; text-decoration: none;
    font: 500 12px/16px var(--sans); color: var(--primary);
  }
  .pop .links svg { width: 14px; height: 14px; }

  /* ---------------- compatibility ---------------- */
  .compat { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding-bottom: 28px; }
  .ctl {
    position: relative; display: inline-flex; align-items: center; gap: 10px;
    height: 40px; padding: 0 14px; border: 1px solid var(--outline);
    border-radius: 10px; background: var(--surface);
  }
  .ctl .k { font: 400 13px/16px var(--sans); color: var(--on-surface-variant); }
  .ctl .v { font: 500 13px/16px var(--sans); color: var(--on-surface); }
  .ctl select {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; cursor: pointer; border: none;
  }
  .ctl svg.chev { width: 16px; height: 16px; color: var(--on-surface-variant); }
  .badge-detected {
    display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 5px;
    background: var(--success-container); color: var(--success); font: 500 11px/16px var(--mono);
  }
  .badge-eol {
    display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 5px;
    background: var(--warn-container); color: var(--warn); font: 500 11px/16px var(--mono);
  }
  .derived { font: 400 12px/16px var(--mono); color: var(--on-surface-muted); }
  .compat a.ref { font: 400 12px/16px var(--sans); color: var(--primary); text-decoration: none; }
  .compat a.ref:hover { text-decoration: underline; }
  .inline-warn {
    flex-basis: 100%; display: flex; gap: 8px; align-items: flex-start;
    font: 400 12px/18px var(--sans); color: var(--warn);
    background: var(--warn-container); padding: 10px 12px; border-radius: 10px;
  }
  .inline-warn svg { width: 16px; height: 16px; flex: none; margin-top: 1px; }

  /* ---------------- action bar ---------------- */
  .actionbar {
    flex: none; display: flex; align-items: center; gap: 16px;
    height: 76px; padding: 0 32px;
    border-top: 1px solid var(--divider); background: var(--surface-low);
  }
  .actionbar .summary { min-width: 0; }
  .summary .line1 { font: 500 14px/18px var(--sans); color: var(--on-surface); }
  .summary .line2 {
    font: 400 12px/16px var(--mono); color: var(--on-surface-muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .summary .line2.err { color: var(--error); }
  .actionbar .spacer { flex: 1; }
  .check { display: inline-flex; align-items: center; gap: 8px; font: 400 13px/16px var(--sans); color: var(--on-surface-variant); cursor: pointer; }
  .check input { width: 16px; height: 16px; accent-color: var(--primary); margin: 0; cursor: pointer; }
  .toml-toggle {
    display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px;
    border: 1px solid var(--outline); border-radius: 12px; background: var(--surface);
    font: 500 13px/16px var(--mono); color: var(--on-surface); cursor: pointer;
  }
  .toml-toggle svg { width: 15px; height: 15px; color: var(--on-surface-variant); }
  .primary-btn {
    display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 26px;
    border: none; border-radius: 12px; background: var(--primary); color: var(--on-primary);
    font: 500 15px/20px var(--sans); cursor: pointer;
  }
  .primary-btn:hover:not(:disabled) { background: var(--primary-hover); }
  .primary-btn:active:not(:disabled) { background: var(--primary-press); }
  .primary-btn:disabled { opacity: .38; cursor: not-allowed; }
  .primary-btn svg { width: 18px; height: 18px; }

  /* ---------------- drawer ---------------- */
  .backdrop {
    position: fixed; inset: 0; background: rgba(31,31,31,.32); z-index: 70;
    opacity: 0; visibility: hidden; transition: opacity .18s cubic-bezier(.2,0,0,1), visibility .18s;
  }
  .backdrop.open { opacity: 1; visibility: visible; }
  .drawer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 80;
    height: min(52vh, 520px); background: var(--surface);
    border-top: 1px solid var(--divider); border-radius: 14px 14px 0 0;
    box-shadow: var(--shadow-drawer); display: flex; flex-direction: column;
    transform: translateY(100%); transition: transform .18s cubic-bezier(.2,0,0,1);
  }
  .drawer.open { transform: none; }
  @media (prefers-reduced-motion: reduce) {
    .drawer, .backdrop { transition: none; }
  }
  .drawer-head {
    flex: none; display: flex; align-items: center; gap: 12px;
    height: 44px; padding: 0 20px; border-bottom: 1px solid var(--divider);
  }
  .drawer-head .name { font: 500 12px/16px var(--mono); color: var(--on-surface); }
  .drawer-head .spacer { flex: 1; }
  .drawer-head button {
    background: none; border: none; cursor: pointer;
    font: 500 12px/16px var(--sans); color: var(--primary); padding: 4px 6px;
  }
  .drawer pre {
    flex: 1; margin: 0; overflow: auto; padding: 14px 20px;
    font: 400 12px/20px var(--mono); white-space: pre; color: var(--on-surface-variant);
  }
  .drawer pre.log { white-space: pre-wrap; word-break: break-word; }
  .cmt { color: var(--on-surface-faint); }
  .sec { color: var(--primary); font-weight: 500; }
  .key { color: var(--on-surface); }
  .str { color: #0842a0; }
  html[data-theme="dark"] .str { color: #a8c7fa; }
  .log .ok { color: var(--success); }
  .log .err { color: var(--error); }

  /* ---------------- compare dialog ---------------- */
  dialog.compare {
    border: none; border-radius: 14px; padding: 0; max-width: 880px; width: 92vw;
    max-height: 82vh; background: var(--surface); color: var(--on-surface);
    box-shadow: var(--shadow-pop);
  }
  dialog.compare::backdrop { background: rgba(31,31,31,.32); }
  .cmp-head {
    display: flex; align-items: center; height: 52px; padding: 0 20px;
    border-bottom: 1px solid var(--divider);
  }
  .cmp-head h2 { margin: 0; font: 500 16px/22px var(--sans); letter-spacing: .1px; }
  .cmp-head .spacer { flex: 1; }
  .cmp-head button { background: none; border: none; cursor: pointer; color: var(--on-surface-variant); padding: 6px; }
  .cmp-head svg { width: 20px; height: 20px; display: block; }
  .cmp-body { overflow: auto; padding: 8px 20px 20px; }
  .cmp-item { display: flex; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--divider); }
  .cmp-item:last-child { border-bottom: none; }
  .cmp-item img { width: 28px; height: 28px; object-fit: contain; flex: none; margin-top: 2px; }
  .cmp-item h3 { margin: 0; font: 500 15px/20px var(--sans); }
  .cmp-item .vendor { font: 400 11px/16px var(--mono); color: var(--on-surface-muted); }
  .cmp-item p { margin: 6px 0 0; font: 400 13px/18px var(--sans); color: var(--on-surface-variant); }
  .cmp-item p.trade { color: var(--on-surface-muted); }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  @media (max-width: 1180px) {
    .presets, .stack { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .stack > .seg-row:nth-child(3n) .pop { left: 0; right: auto; }
    .stack > .seg-row:nth-child(2n) .pop { left: auto; right: 0; }
    .fields { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 860px) {
    .presets, .stack, .fields { grid-template-columns: 1fr; }
    .stack > .seg-row .pop { left: 0; right: auto; }
    .scroll { padding: 20px 16px 0; }
    .hdr, .actionbar { padding: 0 16px; }
    .actionbar .summary .line2 { display: none; }
  }
</style>
</head>
<body>
<div class="shell">

  <header class="hdr">
    <img class="mark" src="/logos/appmark.svg" alt="">
    <span class="wordmark">android-kickstart</span>
    <span class="spacer"></span>
    <div id="env"></div>
    <div class="theme-toggle" role="group" aria-label="Theme">
      <button type="button" id="themeLight" aria-pressed="true">Light</button>
      <button type="button" id="themeDark" aria-pressed="false">Dark</button>
    </div>
  </header>

  <div class="scroll">
    <div class="title-row">
      <h1>Start from a known-good stack</h1>
      <span class="note">Every preset builds green in CI today.</span>
    </div>

    <div class="presets" id="presets"></div>

    <div class="rule">
      <span class="label">Project</span>
      <span class="line"></span>
    </div>

    <div class="fields">
      <div class="field">
        <label for="name">App name</label>
        <input type="text" id="name" value="MyApp" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="pkg">Package</label>
        <input type="text" id="pkg" class="mono" value="com.example.myapp" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="destPath">Destination folder</label>
        <div class="dest">
          <span class="path" id="destPath" title=""></span>
          <span class="sep"></span>
          <button type="button" class="browse" id="browse">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
            Browse
          </button>
        </div>
      </div>
    </div>

    <div class="rule">
      <span class="label">Stack</span>
      <span class="sub" id="stackSub"></span>
      <span class="line"></span>
      <button type="button" class="link" id="compareBtn">Compare libraries</button>
    </div>

    <div class="stack" id="stack"></div>

    <div class="rule" style="margin:28px 0 16px">
      <span class="label">Compatibility</span>
      <span class="line"></span>
    </div>

    <div class="compat">
      <div class="ctl">
        <span class="k">Android Studio</span>
        <span class="v" id="studioValue">…</span>
        <span id="studioBadge"></span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        <select id="studio" aria-label="Android Studio version"></select>
      </div>
      <div class="ctl">
        <span class="k">minSdk</span>
        <span class="v" id="minSdkValue">…</span>
        <span id="minSdkBadge"></span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        <select id="minSdk" aria-label="Minimum SDK"></select>
      </div>
      <span class="derived" id="derived"></span>
      <a class="ref" id="eolLink" target="_blank" rel="noopener">Which Android versions are still supported?</a>
      <div id="compatWarn"></div>
    </div>

    <div id="envGuide" style="padding-bottom:24px"></div>
  </div>

  <div class="actionbar">
    <div class="summary">
      <div class="line1" id="sumLine1">MyApp</div>
      <div class="line2" id="sumLine2">resolving…</div>
    </div>
    <span class="spacer"></span>
    <label class="check" for="autorun" title="Studio runs its own Gradle sync on open, so nothing is built here.">
      <input type="checkbox" id="autorun" checked>
      Open in Android Studio
    </label>
    <button type="button" class="toml-toggle" id="tomlToggle">
      libs.versions.toml
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="tomlChev"><path d="M18 15l-6-6-6 6"/></svg>
    </button>
    <button type="button" class="primary-btn" id="create">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Set up project
    </button>
  </div>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="drawer" id="drawer" role="dialog" aria-label="Details">
  <div class="drawer-head">
    <span class="name" id="drawerName">gradle/libs.versions.toml</span>
    <span class="spacer"></span>
    <button type="button" id="drawerRefresh">Refresh</button>
    <button type="button" id="drawerClose" aria-label="Close">Close</button>
  </div>
  <pre id="toml"></pre>
  <pre id="log" class="log" hidden></pre>
</div>

<dialog class="compare" id="compare">
  <div class="cmp-head">
    <h2>Compare libraries</h2>
    <span class="spacer"></span>
    <button type="button" id="compareClose" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="cmp-body" id="compareBody"></div>
</dialog>

<script>
const GROUPS = {
  di:      { label: 'Injection',   opts: [['hilt','Hilt'],['koin','Koin'],['none','None']] },
  network: { label: 'Networking',  opts: [['retrofit','Retrofit'],['ktor','Ktor'],['none','None']] },
  db:      { label: 'Database',    opts: [['room','Room'],['sqldelight','SQLDelight'],['none','None']] },
  prefs:   { label: 'Preferences', opts: [['datastore','DataStore'],['none','None']] },
  image:   { label: 'Images',      opts: [['coil','Coil'],['glide','Glide'],['none','None']] },
  sample:  { label: 'Sample code', opts: [['yes','Login + Home'],['no','Empty shell']] },
};

const PRESETS = {
  standard: {
    title: 'Standard app',
    body: 'What most teams ship. Compile-time DI, typed SQLite, sample screens included.',
    logos: ['hilt.svg', 'square.svg', 'sqlite.svg', 'datastore.svg', 'coil.svg'],
    choices: { di: 'hilt', network: 'retrofit', db: 'room', prefs: 'datastore', image: 'coil', sample: 'yes' },
  },
  multiplatform: {
    title: 'Multiplatform-ready',
    body: 'Pure-Kotlin choices only, so the data layer can move to iOS later.',
    logos: ['koin.png', 'ktor.svg', 'sqldelight.svg', 'datastore.svg', 'coil.svg'],
    choices: { di: 'koin', network: 'ktor', db: 'sqldelight', prefs: 'datastore', image: 'coil', sample: 'yes' },
  },
  minimal: {
    title: 'Minimal shell',
    body: 'Compose, navigation and a ServiceLocator. No libraries to argue about.',
    logos: ['compose.svg', 'kotlin.svg', 'none.svg'],
    choices: { di: 'none', network: 'none', db: 'none', prefs: 'none', image: 'none', sample: 'no' },
  },
};

// Sample-code segments have no entry in libraries.json, so their popovers come from here.
const SAMPLE_INFO = {
  yes: { name: 'Login + Home', logo: 'android.svg',
    summary: 'A login screen with validation, loading and error states, a home screen, an AuthRepository with a stub sign-in, and five unit tests using fakes.',
    tradeoff: 'Everything builds and runs as generated. Delete what you do not want.' },
  no: { name: 'Empty shell', logo: 'none.svg',
    summary: 'Skips the screens and tests. You still get the Application class, theme, navigation host, DI graph, repositories and database wiring.',
    tradeoff: 'A placeholder screen to replace with your first feature.' },
};

const $ = (id) => document.getElementById(id);
let LIBS = {}, INIT = null, busy = false, seq = 0;
let choices = { ...PRESETS.standard.choices };
let preset = 'standard';
let drawer = 'closed';
let lastPreview = null;
let pkgTouched = false;

const IC = {
  gh: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5A11.5 11.5 0 00.5 12a11.5 11.5 0 007.86 10.92c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.54-3.88-1.54-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.56-.29-5.25-1.28-5.25-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 015.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.43-2.7 5.4-5.27 5.69.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0023.5 12 11.5 11.5 0 0012 .5z"/></svg>',
  doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 016.5 3H20v15H6.5A2.5 2.5 0 004 20.5z"/><path d="M4 20.5A2.5 2.5 0 016.5 18H20v3H6.5"/></svg>',
  tick: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>',
};

const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const infoFor = (group, value) => (group === 'sample' ? SAMPLE_INFO[value] : LIBS[value]);

/* ---------------- theme ---------------- */
function applyTheme(mode) {
  document.documentElement.setAttribute('data-theme', mode);
  $('themeLight').setAttribute('aria-pressed', String(mode === 'light'));
  $('themeDark').setAttribute('aria-pressed', String(mode === 'dark'));
  try { localStorage.setItem('ak-theme', mode); } catch { /* private mode */ }
}
applyTheme(
  (() => {
    try { return localStorage.getItem('ak-theme'); } catch { return null; }
  })() || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
);
$('themeLight').addEventListener('click', () => applyTheme('light'));
$('themeDark').addEventListener('click', () => applyTheme('dark'));

/* ---------------- presets ---------------- */
function matchedPreset() {
  for (const [key, p] of Object.entries(PRESETS)) {
    if (Object.entries(p.choices).every(([k, v]) => choices[k] === v)) return key;
  }
  return 'custom';
}

function renderPresets() {
  $('presets').innerHTML = Object.entries(PRESETS).map(([key, p]) => {
    const on = preset === key;
    const modified = on && matchedPreset() !== key;
    return '<button type="button" class="preset" data-preset="' + key + '" aria-pressed="' + on + '">'
      + '<span class="preset-head">'
      + '<span class="preset-title">' + esc(p.title) + '</span>'
      + (on && !modified ? '<span class="badge-selected">selected</span>' : '')
      + (modified ? '<span class="modified">modified</span>' : '')
      + '<span class="tick">' + IC.tick + '</span>'
      + '</span>'
      + '<p>' + esc(p.body) + '</p>'
      + '<span class="logos">' + p.logos.map((l) => '<img src="/logos/' + l + '" alt="">').join('') + '</span>'
      + '</button>';
  }).join('');
  for (const el of document.querySelectorAll('.preset')) {
    el.addEventListener('click', () => {
      preset = el.dataset.preset;
      choices = { ...PRESETS[preset].choices };
      renderPresets(); renderStack(); updateSummary(); refresh();
    });
  }
  $('stackSub').textContent = preset === 'custom'
    ? 'custom selection'
    : 'from "' + PRESETS[preset].title + '", change anything';
}

/* ---------------- stack ---------------- */
function popover(group, value) {
  const lib = infoFor(group, value);
  if (!lib || value === 'none') return '';
  const links = [
    lib.github ? '<a href="' + lib.github + '" target="_blank" rel="noopener">' + IC.gh + 'GitHub</a>' : '',
    lib.docs ? '<a href="' + lib.docs + '" target="_blank" rel="noopener">' + IC.doc + 'Docs</a>' : '',
  ].join('');
  return '<div class="pop" role="tooltip">'
    + '<div class="pop-head"><img src="/logos/' + (lib.logo || 'none.svg') + '" alt="">'
    + '<div><div class="pop-title">' + esc(lib.name) + '</div>'
    + (lib.vendor ? '<div class="pop-vendor">' + esc(lib.vendor) + '</div>' : '')
    + '</div></div>'
    + '<p class="lead">' + esc(lib.summary) + '</p>'
    + (lib.tradeoff ? '<p>' + esc(lib.tradeoff) + '</p>' : '')
    + (links ? '<div class="links">' + links + '</div>' : '')
    + '</div>';
}

function renderStack() {
  $('stack').innerHTML = Object.entries(GROUPS).map(([group, g]) => {
    const segs = g.opts.map(([value, label], i) => {
      const info = infoFor(group, value);
      const logo = value === 'none' ? null : (info && info.logo);
      const on = choices[group] === value;
      return (i ? '<span class="divider"></span>' : '')
        + '<button type="button" data-group="' + group + '" data-value="' + value + '"'
        + ' aria-pressed="' + on + '"' + (logo ? '' : ' class="plain"') + '>'
        + (logo ? '<img src="/logos/' + logo + '" alt="">' : '') + esc(label) + '</button>';
    }).join('');
    // One popover per row, describing the selected segment, anchored above the control.
    return '<div class="seg-row">'
      + '<span class="row-label">' + esc(g.label) + '</span>'
      + '<span class="seg">' + segs + '</span>'
      + popover(group, choices[group])
      + '</div>';
  }).join('');

  for (const btn of $('stack').querySelectorAll('button[data-group]')) {
    btn.addEventListener('click', () => {
      choices[btn.dataset.group] = btn.dataset.value;
      preset = matchedPreset() === 'custom' ? preset : matchedPreset();
      renderPresets(); renderStack(); updateSummary(); refresh();
    });
  }
}

/* ---------------- config ---------------- */
const destRoot = () => ($('destPath').dataset.root || '');
const appName = () => $('name').value.trim() || 'MyApp';
const config = () => ({
  name: appName(),
  packageName: $('pkg').value.trim(),
  out: destRoot(),
  ...choices,
  minSdk: Number($('minSdk').value) || 24,
  studio: $('studio').value,
});

function updateDestDisplay() {
  const root = destRoot();
  const sep = root.includes('/') && !root.includes('\\') ? '/' : '\\';
  const full = root ? root.replace(/[\\/]+$/, '') + sep + appName() : '';
  $('destPath').textContent = full || 'Choose a folder…';
  $('destPath').title = full;
}

function updateSummary() {
  const label = matchedPreset() === 'custom' ? 'Custom' : PRESETS[matchedPreset()].title;
  $('sumLine1').textContent = appName() + ' · ' + label;
  if (lastPreview) {
    const root = destRoot();
    const tail = root ? root.split(/[\\/]/).filter(Boolean).slice(-1)[0] + '\\' + appName() : 'no folder chosen';
    $('sumLine2').className = 'line2';
    $('sumLine2').textContent = lastPreview.fileCount + ' files · '
      + lastPreview.versionCount + ' pinned versions · ' + tail;
  }
}

$('name').addEventListener('input', () => {
  if (!pkgTouched) {
    const slug = $('name').value.toLowerCase().replace(/[^a-z0-9]/g, '') || 'myapp';
    $('pkg').value = 'com.example.' + slug;
  }
  updateDestDisplay(); updateSummary();
});
$('pkg').addEventListener('input', () => { pkgTouched = true; });

/* ---------------- resolve ---------------- */
function highlightToml(src) {
  // esc() turned the TOML's quotes into &quot;, so the string rule must match those - a
  // literal quote would also hit the ones inside the class="..." attributes added below.
  return esc(src)
    .replace(/&quot;([^&]*)&quot;/g, '<span class="str">&quot;$1&quot;</span>')
    .replace(/^(#.*)$/gm, '<span class="cmt">$1</span>')
    .replace(/^(\[[^\]]+\])$/gm, '<span class="sec">$1</span>')
    .replace(/^([A-Za-z0-9_.-]+)(\s*=)/gm, '<span class="key">$1</span>$2')
    .replace(/( #[^\n<]*)$/gm, '<span class="cmt">$1</span>');
}

async function refresh() {
  if (busy) return;
  const mine = ++seq;
  if (drawer === 'toml') $('toml').textContent = 'resolving…';
  try {
    const res = await fetch('/api/preview', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(config()),
    });
    const data = await res.json();
    if (mine !== seq) return;
    if (data.error) throw new Error(data.error);
    lastPreview = data;
    $('toml').innerHTML = highlightToml(data.toml);
    // The ceiling, not the resolved patch version: "AGP <= 9.2" is the constraint the
    // chosen Android Studio imposes, which is what this line is telling you.
    const chosen = INIT.studios.find((x) => x.version === $('studio').value);
    const agpCeiling = chosen ? chosen.agpMax : (data.agp || '?');
    $('derived').textContent = '→ AGP ≤ ' + agpCeiling + ' · Gradle ' + data.gradleVersion
      + ' · JDK ' + data.javaVersion + ' · compileSdk ≤ ' + data.compileSdk;
    renderCompatWarning(data.warnings || []);
    updateSummary();
  } catch (e) {
    if (mine !== seq) return;
    $('sumLine2').className = 'line2 err';
    $('sumLine2').textContent = 'could not resolve: ' + e.message;
  }
}

function renderCompatWarning(warnings) {
  const relevant = warnings.filter((w) => /compileSdk/.test(w));
  $('compatWarn').innerHTML = relevant.length
    ? '<div class="inline-warn">' + IC.warn + '<span>' + esc(relevant[0]) + '</span></div>'
    : '';
}

/* ---------------- compatibility controls ---------------- */
function updateStudioDisplay() {
  const s = INIT.studios.find((x) => x.version === $('studio').value);
  $('studioValue').textContent = s ? s.label : 'Latest available';
  const detected = INIT.detected && s && s.version === INIT.detected.version;
  $('studioBadge').innerHTML = detected ? '<span class="badge-detected">detected</span>' : '';
}

function updateMinSdkDisplay() {
  const l = INIT.apiLevels.find((x) => String(x.api) === $('minSdk').value);
  $('minSdkValue').textContent = l ? 'API ' + l.api + ' · Android ' + l.version : '';
  $('minSdkBadge').innerHTML = l && l.eol ? '<span class="badge-eol">EOL</span>' : '';
}

/* ---------------- drawer ---------------- */
function setDrawer(mode) {
  drawer = mode;
  const open = mode !== 'closed';
  $('drawer').classList.toggle('open', open);
  $('backdrop').classList.toggle('open', open);
  $('toml').hidden = mode !== 'toml';
  $('log').hidden = mode !== 'log';
  $('drawerRefresh').hidden = mode !== 'toml';
  $('drawerName').textContent = mode === 'log' ? 'setting up' : 'gradle/libs.versions.toml';
  $('tomlChev').innerHTML = open ? '<path d="M6 9l6 6 6-6"/>' : '<path d="M18 15l-6-6-6 6"/>';
}
$('tomlToggle').addEventListener('click', () => setDrawer(drawer === 'toml' ? 'closed' : 'toml'));
$('drawerClose').addEventListener('click', () => setDrawer('closed'));
$('backdrop').addEventListener('click', () => setDrawer('closed'));
$('drawerRefresh').addEventListener('click', refresh);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && drawer !== 'closed') setDrawer('closed'); });

/* ---------------- compare dialog ---------------- */
$('compareBtn').addEventListener('click', () => {
  const seen = new Set();
  const items = [];
  for (const [group, g] of Object.entries(GROUPS)) {
    for (const [value] of g.opts) {
      const lib = infoFor(group, value);
      if (!lib || seen.has(lib.name)) continue;
      seen.add(lib.name);
      items.push('<div class="cmp-item"><img src="/logos/' + (lib.logo || 'none.svg') + '" alt="">'
        + '<div><h3>' + esc(lib.name) + '</h3>'
        + (lib.vendor ? '<div class="vendor">' + esc(lib.vendor) + '</div>' : '')
        + '<p>' + esc(lib.summary) + '</p>'
        + (lib.tradeoff ? '<p class="trade">' + esc(lib.tradeoff) + '</p>' : '')
        + (lib.github || lib.docs
            ? '<div class="links" style="display:flex;gap:8px;margin-top:10px">'
              + (lib.github ? '<a href="' + lib.github + '" target="_blank" rel="noopener" style="color:var(--primary);text-decoration:none;font:500 12px/16px var(--sans)">GitHub</a>' : '')
              + (lib.docs ? '<a href="' + lib.docs + '" target="_blank" rel="noopener" style="color:var(--primary);text-decoration:none;font:500 12px/16px var(--sans)">Docs</a>' : '')
              + '</div>'
            : '')
        + '</div></div>');
    }
  }
  $('compareBody').innerHTML = items.join('');
  $('compare').showModal();
});
$('compareClose').addEventListener('click', () => $('compare').close());

/* ---------------- actions ---------------- */
function setBusy(on) {
  busy = on;
  for (const id of ['create', 'browse', 'tomlToggle', 'compareBtn']) $(id).disabled = on;
}
function log(text, cls) {
  const s = document.createElement('span');
  if (cls) s.className = cls;
  s.textContent = text;
  $('log').appendChild(s);
  $('log').scrollTop = $('log').scrollHeight;
}

$('browse').addEventListener('click', async () => {
  setBusy(true);
  try {
    const data = await (await fetch('/api/pick-folder', { method: 'POST' })).json();
    if (data.path) {
      $('destPath').dataset.root = data.path;
      updateDestDisplay(); updateSummary();
    }
  } finally { setBusy(false); }
});

$('create').addEventListener('click', () => {
  const cfg = config();
  if (!cfg.out) {
    $('sumLine2').className = 'line2 err';
    $('sumLine2').textContent = 'Choose a destination folder first.';
    $('browse').focus();
    return;
  }
  $('log').textContent = '';
  setDrawer('log');
  setBusy(true);
  $('create').textContent = 'Setting up…';

  const params = new URLSearchParams(Object.assign({}, cfg, {
    build: '', open: $('autorun').checked ? '1' : '',
  }));
  const es = new EventSource('/api/create?' + params.toString());
  es.addEventListener('out', (e) => log(JSON.parse(e.data)));
  es.addEventListener('done', (e) => {
    const d = JSON.parse(e.data);
    log('\n' + (d.ok ? '✓ ' : '✗ ') + d.message + '\n', d.ok ? 'ok' : 'err');
    setBusy(false);
    $('create').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Set up project';
    es.close();
  });
  es.onerror = () => {
    log('\nconnection lost\n', 'err');
    setBusy(false); es.close();
  };
});

/* ---------------- init ---------------- */
function envPill() {
  const missing = [];
  if (!INIT.detected) missing.push('Android Studio');
  if (!INIT.sdkDir) missing.push('SDK');
  if (!INIT.jdk) missing.push('JDK');
  const paths = [
    INIT.detected ? 'Studio: ' + INIT.detected.name + ' ' + INIT.detected.version : 'Studio: not found',
    'SDK: ' + (INIT.sdkDir || 'not found'),
    'JDK: ' + (INIT.jdk ? INIT.jdk.home : 'not found'),
  ].join('\n');
  const ok = missing.length === 0;
  $('env').innerHTML = '<span class="env-pill' + (ok ? '' : ' bad actionable') + '" title="' + esc(paths) + '">'
    + '<span class="dot"></span>'
    + esc(ok ? 'Studio, SDK and JDK all found' : missing.join(' and ') + ' not found')
    + '</span>';
  if (!ok) {
    $('env').querySelector('.env-pill').addEventListener('click', () => {
      const d = $('envGuide').querySelector('details');
      if (d) { d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    });
  }
}

function installGuide() {
  if (INIT.sdkDir && INIT.jdk) return '';
  const steps = !INIT.sdkDir
    ? ['Install <b>Android Studio</b> from <code>developer.android.com/studio</code>. It bundles the SDK and a working JDK.',
       'Open it once and finish the setup wizard, which is what actually downloads the SDK.',
       'The SDK lands in <code>%LOCALAPPDATA%\\Android\\Sdk</code> on Windows, <code>~/Library/Android/sdk</code> on macOS, <code>~/Android/Sdk</code> on Linux.',
       'Reload this page. If it is still not found, set <code>ANDROID_HOME</code> to that path.']
    : ['Install <b>JDK 17 or newer</b>, for example Temurin from <code>adoptium.net</code>.',
       'Set <code>JAVA_HOME</code> to the install directory, then reopen your terminal.'];
  return '<details><summary style="cursor:pointer;font:500 13px/18px var(--sans);color:var(--primary)">How to install what is missing</summary>'
    + '<ol style="margin:10px 0 0;padding-left:20px;font:400 13px/20px var(--sans);color:var(--on-surface-variant)">'
    + steps.map((s) => '<li>' + s + '</li>').join('') + '</ol></details>';
}

async function init() {
  LIBS = await (await fetch('/libraries.json')).json();
  INIT = await (await fetch('/api/init')).json();

  $('destPath').dataset.root = INIT.defaultOut || '';
  updateDestDisplay();
  envPill();
  $('envGuide').innerHTML = installGuide();

  $('studio').innerHTML = '<option value="">Latest available, no cap</option>'
    + INIT.studios.map((s) => '<option value="' + s.version + '"'
        + (INIT.detected && s.version === INIT.detected.version ? ' selected' : '')
        + '>' + s.label + '  ·  AGP ' + s.agpMax + ' max'
        + (INIT.detected && s.version === INIT.detected.version ? '  ·  detected on this machine' : '')
        + '</option>').join('');

  $('minSdk').innerHTML = INIT.apiLevels.map((l) =>
    '<option value="' + l.api + '"' + (l.api === 24 ? ' selected' : '') + '>'
    + 'API ' + l.api + '  ·  Android ' + l.version + (l.codename ? ' ' + l.codename : '')
    + (l.eol ? '  ·  EOL' : '') + '</option>').join('');
  $('eolLink').href = INIT.apiLevelsLink;

  $('studio').addEventListener('change', () => { updateStudioDisplay(); refresh(); });
  $('minSdk').addEventListener('change', () => { updateMinSdkDisplay(); refresh(); });
  updateStudioDisplay();
  updateMinSdkDisplay();

  renderPresets();
  renderStack();
  updateSummary();
  refresh();
}

// Tell the server we are still here; it exits shortly after the tab goes away.
setInterval(() => { fetch('/api/ping').catch(() => {}); }, 5000);
window.addEventListener('pagehide', () => { navigator.sendBeacon('/api/bye'); });

init();
</script>
</body>
</html>
